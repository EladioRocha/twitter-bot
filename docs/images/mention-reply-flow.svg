<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title description">
  <title id="title">Twitter mention reply bot workflow</title>
  <desc id="description">A tracked mention is received through statuses/filter. The Node.js handler creates a reply and publishes it through statuses/update with the original post ID.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1080" height="380" rx="20" fill="#0f172a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="54" font-size="28" font-weight="700" fill="#f8fafc">From mention to reply</text>
    <text x="40" y="85" font-size="16" fill="#cbd5e1">An event-driven Node.js example using Twit</text>
    <rect x="40" y="125" width="280" height="170" rx="14" fill="#1e293b" stroke="#475569"/>
    <rect x="400" y="125" width="280" height="170" rx="14" fill="#1e293b" stroke="#475569"/>
    <rect x="760" y="125" width="280" height="170" rx="14" fill="#1e293b" stroke="#475569"/>
    <path d="M 330 210 H 386" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 690 210 H 746" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <g fill="#38bdf8" font-size="13" font-weight="700">
      <text x="62" y="156">01 / LISTEN</text><text x="422" y="156">02 / HANDLE</text><text x="782" y="156">03 / REPLY</text>
    </g>
    <g fill="#f8fafc" font-size="23" font-weight="700">
      <text x="62" y="195">Tracked mention</text><text x="422" y="195">Build the message</text><text x="782" y="195">Publish a reply</text>
    </g>
    <g fill="#cbd5e1" font-size="16">
      <text x="62" y="228">Receive a matching post</text><text x="62" y="254">through statuses/filter</text>
      <text x="422" y="228">Read the author's handle</text><text x="422" y="254">and the original post ID</text>
      <text x="782" y="228">Call statuses/update</text><text x="782" y="254">with in_reply_to_status_id</text>
    </g>
    <text x="40" y="342" font-size="15" fill="#94a3b8">Credentials are loaded from a local .env file. Running the bot can publish real replies.</text>
  </g>
</svg>
